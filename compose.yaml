version: "3.9"

services:
  web:
    build: .
    container_name: reai_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    env_file:
      - .env

  db:
    image: postgres:16
    container_name: reai_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: reai_redis
    restart: always
    ports:
      - "6379:6379"

  celery_worker:
    build: .
    container_name: reai_worker
    command: celery -A reai worker -l info --pool=solo
    volumes:
      - .:/app
    depends_on:
      - redis
      - db
    env_file:
      - .env


volumes:
  pgdata: